<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1730">
  <meta name="robots" content="noindex">
  <title>Enquiry received | Ittaru Innovations</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="success-page">
    <div class="success-card">
      <a class="brand" href="/" aria-label="Ittaru Innovations home"><img src="assets/logo.svg" width="246" height="64" alt="Ittaru Innovations"></a>
      <div class="success-check" aria-hidden="true">✓</div>
      <p class="eyebrow">MESSAGE SENT</p>
      <h1>Thanks for reaching out.</h1>
      <p>Your enquiry has been submitted. We appreciate you considering Ittaru Innovations and will be in touch soon.</p>
      <a class="button button-primary" href="/">Back to home <span aria-hidden="true">↗</span></a>
    </div>
  </main>
  <style>
    .success-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 70% 20%,#eaf5ff,transparent 35%),#f8fbff}
    .success-card{width:min(100%,560px);padding:clamp(28px,6vw,56px);border:1px solid #e3eaf4;border-radius:26px;background:#fff;box-shadow:0 24px 70px rgba(16,33,63,.08)}
    .success-card .brand{margin-bottom:44px}.success-check{display:grid;place-items:center;width:56px;height:56px;margin-bottom:25px;border-radius:18px;background:#e8f8f1;color:#14865e;font-size:28px;font-weight:800}
    .success-card h1{font-size:clamp(36px,7vw,52px);margin-bottom:15px}.success-card>p:not(.eyebrow){color:#68758b;line-height:1.8;margin-bottom:28px}
  </style>
</body>
</html>
